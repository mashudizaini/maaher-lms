name: CI
on:
  pull_request:
  push:
    branches: [main, feat/LMS-01-auth0-development]
permissions:
  contents: read

defaults:
  run:
    working-directory: maaher-lms-starter

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maaher_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d maaher_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/maaher_test_ci
      TEST_DATABASE_URL: postgresql://maaher_api@127.0.0.1:5432/maaher_test_ci
      TEST_AUTH_DATABASE_URL: postgresql://maaher_auth_login@127.0.0.1:5432/maaher_test_ci
      TEST_OPERATOR_DATABASE_URL: postgresql://maaher_operator_login@127.0.0.1:5432/maaher_test_ci
      TEST_MAIL_DATABASE_URL: postgresql://maaher_mail_login@127.0.0.1:5432/maaher_test_ci
      TEST_MAINTENANCE_DATABASE_URL: postgresql://maaher_maintenance_login@127.0.0.1:5432/maaher_test_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - name: Provision roles in disposable CI cluster
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ['TEST_MIGRATION_DATABASE_URL']) as db:
              assert db.execute('SELECT current_database()').fetchone()[0].startswith('maaher_test_')
              db.execute(Path('infra/development-roles.sql').read_text())
              for login,group in [('maaher_api','maaher_runtime'),('maaher_auth_login','maaher_auth'),('maaher_operator_login','maaher_mfa_operator'),('maaher_mail_login','maaher_mailer'),('maaher_maintenance_login','maaher_maintenance')]:
                  db.execute(f'CREATE ROLE {login} LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE {group}')
          PY
      - run: python -m pytest -q apps/api/tests
      - run: python -m pytest -q scripts/tests/test_auth0_preflight.py
      - run: python -m compileall -q apps/api/app
      - run: python scripts/audit-api-dependencies.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test infra/auth0/*.test.cjs
      - run: npm ci --no-audit --no-fund
        working-directory: maaher-lms-starter/apps/web
      - run: npm run build
        working-directory: maaher-lms-starter/apps/web
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: maaher-lms-starter/apps/web
      - name: Create separate browser test database
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['TEST_MIGRATION_DATABASE_URL'],autocommit=True) as db:
              db.execute('CREATE DATABASE maaher_test_browser_ci')
          PY
      - name: Browser security regression suite
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/maaher_test_browser_ci
          TEST_DATABASE_URL: postgresql://maaher_api@127.0.0.1:5432/maaher_test_browser_ci
          TEST_AUTH_DATABASE_URL: postgresql://maaher_auth_login@127.0.0.1:5432/maaher_test_browser_ci
          TEST_OPERATOR_DATABASE_URL: postgresql://maaher_operator_login@127.0.0.1:5432/maaher_test_browser_ci
        run: python scripts/test-lms01-browser.py
      - name: Create separate signed OIDC browser test database
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['TEST_MIGRATION_DATABASE_URL'],autocommit=True) as db:
              db.execute('CREATE DATABASE maaher_test_oidc_browser_ci')
          PY
      - name: Signed OIDC browser regression
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/maaher_test_oidc_browser_ci
          TEST_DATABASE_URL: postgresql://maaher_api@127.0.0.1:5432/maaher_test_oidc_browser_ci
          TEST_AUTH_DATABASE_URL: postgresql://maaher_auth_login@127.0.0.1:5432/maaher_test_oidc_browser_ci
          TEST_OPERATOR_DATABASE_URL: postgresql://maaher_operator_login@127.0.0.1:5432/maaher_test_oidc_browser_ci
        run: python scripts/test-lms01-browser.py --oidc
      - name: Create separate development TOTP browser test database
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['TEST_MIGRATION_DATABASE_URL'],autocommit=True) as db:
              db.execute('CREATE DATABASE maaher_test_dev_totp_browser_ci')
          PY
      - name: Development TOTP browser regression
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/maaher_test_dev_totp_browser_ci
          TEST_DATABASE_URL: postgresql://maaher_api@127.0.0.1:5432/maaher_test_dev_totp_browser_ci
          TEST_AUTH_DATABASE_URL: postgresql://maaher_auth_login@127.0.0.1:5432/maaher_test_dev_totp_browser_ci
          TEST_OPERATOR_DATABASE_URL: postgresql://maaher_operator_login@127.0.0.1:5432/maaher_test_dev_totp_browser_ci
        run: python scripts/test-lms01-browser.py --oidc --dev-totp
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: maaher-lms-starter/apps/web
      - run: npm audit --omit=dev
        working-directory: maaher-lms-starter/apps/web
      - run: npm run typecheck && npm run build
        working-directory: maaher-lms-starter/apps/web
